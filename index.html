<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนผู้ร่วมทำบุญ e-Donation - โรงเรียนบ้านกุยเลอตอ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            position: relative;
            background-color: #f8fafc;
            min-height: 100vh;
        }
        /* ลายน้ำพื้นหลังด้วยภาพกลุ่มโรงเรียน */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('312706.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen relative">
    
    <!-- สัญลักษณ์ CodeMantra มุมขวาล่าง (ใช้ชื่อไฟล์ codemantra.jpg) -->
    <div class="fixed bottom-4 right-4 z-50 bg-white/90 backdrop-blur-md p-2.5 rounded-2xl shadow-xl border border-gray-200">
        <img src="codemantra.jpg" alt="CodeMantra Logo" class="h-20 w-auto rounded-xl object-contain">
    </div>

    <div class="max-w-2xl w-full bg-white/95 backdrop-blur-sm shadow-xl rounded-2xl overflow-hidden border border-emerald-100">
        <!-- ส่วนหัวเว็บ -->
        <div class="bg-gradient-to-r from-emerald-700 to-teal-800 text-white p-6 text-center">
            <span class="bg-emerald-600/80 text-emerald-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">โครงการบริจาคเพื่อลดหย่อนภาษี (e-Donation)</span>
            <h1 class="text-2xl md:text-3xl font-bold mt-1">โรงเรียนบ้านกุยเลอตอ</h1>
            <p class="text-emerald-100 text-sm mt-1">โดย กลุ่มพรานบุญ</p>
        </div>

        <div class="p-6 md:p-8">
            <!-- ฟอร์มกรอกข้อมูล -->
            <form id="donationForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- ชื่อ-สกุล -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ-สกุล (ผู้บริจาค) <span class="text-red-500">*</span></label>
                        <input type="text" id="fullName" required placeholder="ระบุ ชื่อ และนามสกุล" 
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- เลขผู้เสียภาษี / บัตรประชาชน -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">เลขประจำตัวประชาชน / ผู้เสียภาษี (13 หลัก) <span class="text-red-500">*</span></label>
                        <input type="text" id="taxId" required maxlength="13" placeholder="เลขบัตรประชาชน 13 หลัก" 
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                        <p id="taxError" class="text-xs text-red-500 mt-1 hidden">กรุณากรอกเลขประจำตัวประชาชนให้ครบ 13 หลัก</p>
                    </div>

                    <!-- จำนวนเงิน -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">จำนวนเงินร่วมทำบุญ (บาท) <span class="text-red-500">*</span></label>
                        <input type="number" id="amount" required min="1" step="any" placeholder="ระบุจำนวนเงิน" 
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                    </div>

                    <!-- ที่อยู่ตามบัตรประชาชน -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ที่อยู่ตามบัตรประชาชน <span class="text-red-500">*</span></label>
                        <textarea id="address" required rows="3" placeholder="บ้านเลขที่, ถนน, ตำบล, อำเภอ, จังหวัด, รหัสไปรษณีย์" 
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"></textarea>
                    </div>
                </div>

                <!-- ปุ่มควบคุม -->
                <div class="flex flex-wrap gap-3 pt-4 border-t border-gray-100">
                    <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        บันทึกข้อมูลเข้า Google Sheets
                    </button>
                    <button type="reset" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-5 rounded-lg transition duration-200">
                        ล้างข้อมูล
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // URL ของ Web App Google Apps Script 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9Y4iKNmbF65kjeiY6rztsOWvW4BjS9hA-kw-EkVtO2RB5uDjzvnGx1fWZ-3eKUDkHXw/exec";

        document.getElementById('donationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const address = document.getElementById('address').value.trim();
            const taxId = document.getElementById('taxId').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);

            // ตรวจสอบเลข 13 หลัก
            if (taxId.length !== 13 || isNaN(taxId)) {
                document.getElementById('taxError').classList.remove('hidden');
                document.getElementById('taxId').focus();
                return;
            } else {
                document.getElementById('taxError').classList.add('hidden');
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังบันทึกข้อมูล...';

            const payload = { fullName, address, taxId, amount };

            // ส่งข้อมูลไปยัง Google Sheets ผ่าน Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                this.reset();
                document.getElementById('fullName').focus();
                alert('บันทึกข้อมูลสำเร็จเรียบร้อยครับ!');
            }).catch(error => {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
            }).finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg> บันทึกข้อมูลเข้าเรียบร้อยแล้วค่ะ
                `;
            });
        });
    </script>
</body>
</html>
